<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Presupuestador</title>
    <!-- Estilos Globales -->
     <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="tarjeta-login">
        <h1 class="login-titulo">Iniciar Sesión</h1>
        <form id="formLogin" class="form-login" action="../api/login.php" method="post">
            <div class="campo-grupo">
                <label for="email_usuario">Email</label>
                <input type="email" id="email_usuario" name="email_usuario" autocomplete="username" required>
            </div>
            <div class="campo-grupo">
                <label for="password_usuario">Contraseña</label>
                <input type="password" id="password_usuario" name="password_usuario" autocomplete="current-password" required>
            </div>

            <p id="errorLogin" class="login-error" role="alert" hidden></p>

            <button type="submit" class="btn-primario btn-bloque">Ingresar</button>
        </form>
    </div>
    <script src="js/login.js?v=2"></script>
</body>
</html>
